paths:
  /private/analyses:
    get:
      tags:
      - Private Scanning - Analyses
      deprecated: false
      description: '> 🚧 Special privileges required

        >

        > Private Scanning endpoints are only available to users with Private Scanning license.


        Returns a list of the last private analyses. The analyses are sorted by most recent first. You can use `?order=date-` to reverse the order.


        ```json /api/v3/private/analyses

        {

        "meta": {

        "cursor": ,

        "count":

        },

        "data": {

        ,

        ,

        ...

        },

        "links": {

        "self": ,

        "next":

        }

        }

        ```

        ```json

        {

        "meta": {

        "count": 90,

        "cursor": "1"

        },

        "data": [

        {

        "attributes": {

        "status": "completed",

        "sandbox_status": {

        "Zenbox": {

        "status": "finished",

        "in_progress_percent": 100

        }

        },

        "sandbox_configuration": {

        "enable_internet": false,

        "command_line": ""

        },

        "date": 1666170912

        },

        "type": "private_analysis",

        "id": "NTJjNTM1MThmMzhiNWRiNGE1ZWQ5ZDhiZjQyNWY2NzM6NTJjMjllYmQ3MThjODM2OWRjNmFiNmIzOTc2MmM3OTY6MTY2NjE3MDkxMg==",

        "links": {

        "item": "https://www.virustotal.com/api/v3/private/files/16f6c6439c5b971218b9cd1d616ba40c7cad08c94984ecfde443dfa3c61c6152",

        "self": "https://www.virustotal.com/api/v3/private/analyses/NTJjNTM1MThmMzhiNWRiNGE1ZWQ5ZDhiZjQyNWY2NzM6NTJjMjllYmQ3MThjODM2OWRjNmFiNmIzOTc2MmM3OTY6MTY2NjE3MDkxMg=="

        }

        }

        ],

        "links": {

        "self": "https://www.virustotal.com/api/v3/private/analyses?limit=1",

        "next": "https://www.virustotal.com/api/v3/private/analyses?cursor=1&limit=1"

        }

        }

        ```'
      operationId: listPrivateAnalyses
      parameters:
      - description: Maximum number of files to retrieve (40 max)
        in: query
        name: limit
        schema:
          default: 10
          format: int32
          type: integer
      - description: Continuation cursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Sorting order
        in: query
        name: order
        schema:
          default: date-
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
