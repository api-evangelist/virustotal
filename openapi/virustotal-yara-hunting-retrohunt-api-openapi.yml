                Result:
                  value: '{}'
              schema:
                properties: {}
                type: object
          description: '400'
      security:
      - VTApiKey: []
      summary: VirusTotal Create a New Retrohunt Job
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
