      deprecated: false
      description: 'This endpoint returns the users and groups that can edit the graph. The graph needs to be shared with them as `Editor` to appear here.


        ```json Response example

        {

        "data": [

        {

        "attributes": {

        "first_name": "Bertram",

        "last_name": "Gilfoyle",

        "profile_phrase": "",

        "reputation": 1,

        "status": "active",

        "user_since": 1530008602

