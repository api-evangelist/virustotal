  /intelligence/hunting_rulesets:
    delete:
      tags:
      - YARA Hunting - Livehunt
      deprecated: false
      description: 'This API call deletes all rulesets owned by the user and removes the user from the list of editors in rules shared with them. This operation is asynchronous: the handler launches a background job and returns immediately. This API endpoint returns a [Operation](https://gtidocs.virustotal.com/reference/operation-object) object.

        '
