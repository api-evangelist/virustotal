              examples:
                Result:
                  value: '{}'
              schema:
                properties: {}
                type: object
          description: '400'
      security:
      - VTApiKey: []
      summary: VirusTotal Delete a Comment
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    get:
