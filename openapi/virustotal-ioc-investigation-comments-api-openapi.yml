      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /comments/{id}/{relationship}:
    get:
      tags:
      - IoC Investigation - Comments
      deprecated: false
      description: 'Comment objects are related to other objects in the Google Threat Intelligence dataset. As mentioned in the Relationships section, those related objects can be retrieved by sending `GET` requests to the relationships endpoint.


        All available relationships are documented in the Comment API object page.'
      operationId: commentsRelationships
      parameters:
      - description: Comment identifier
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Relationship name (see [table](ref:comment-object#relationships))
        in: path
        name: relationship
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                properties: {}
                type: object
          description: '200'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Object not found.
          content:
            application/json:
